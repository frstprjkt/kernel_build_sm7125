name: Kernel build for Galaxy A72 - CI

on:
  workflow_dispatch:
    inputs:
      kernel-branch:
        required: true
        type: string
      kernelsu:
        required: true
        type: boolean
        default: false
      release-type:
        required: true
        type: choice
        options:
        - kaihatsu
        - seishiki
        default: 'kaihatsu'
      kernel-output:
        required: true
        type: choice
        options:
        - anykernel3
        - bootimg
        default: anykernel3
      upload-options:
        required: true
        type: choice
        options:
        - artifact
        - telegram
        default: artifact

jobs:
  env:
    name: Setup environment variables
    runs-on: ubuntu-latest
    outputs:
      anykernel3: ${{ steps.set-env.outputs.anykernel3 }}
      bootimg: ${{ steps.set-env.outputs.bootimg }}
      artifact-upload: ${{ steps.set-env.outputs.artifact-upload }}
      telegram-upload: ${{ steps.set-env.outputs.telegram-upload }}
    steps:
      - name: Set environment variables based on input
        id: set-env
        run: |
          if [ "${{ github.event.inputs.kernel-output }}" = "anykernel3" ]; then
            echo "anykernel3=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.kernel-output }}" = "bootimg" ]; then
            echo "bootimg=true" >> $GITHUB_OUTPUT
          else
            echo "Invalid kernel output option: ${{ github.event.inputs.kernel-output }}"
            exit 1
          fi

          if [ "${{ github.event.inputs.upload-options }}" = "artifact" ]; then
            echo "artifact-upload=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.upload-options }}" = "telegram" ]; then
            echo "telegram-upload=true" >> $GITHUB_OUTPUT
          else
            echo "Invalid upload options: ${{ github.event.inputs.upload-options }}"
            exit 1
          fi

  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest
    needs: env
    env:
      anykernel3: ${{ needs.env.outputs.anykernel3 }}
      bootimg: ${{ needs.env.outputs.bootimg }}
      artifact-upload: ${{ needs.env.outputs.artifact-upload }}
      telegram-upload: ${{ needs.env.outputs.telegram-upload }}
    steps:
      - name: Display parameters
        uses: m-s-abeer/update-gha-summary-with-workflow-inputs@v1

      - name: Build
        uses: frstprjkt/kernel_actions@main
        with:
          kernel-url: https://github.com/frstprjkt/valeryn_samsung_sm7125
          kernel-branch: ${{ github.event.inputs.kernel-branch }}

          arch: arm64
          defconfig: vendor/samsung/sm7125_defconfig vendor/samsung/a72q.config
          extra-args: LLVM=1 LLVM_IAS=1 KBUILD_BUILD_USER=valeryn
          build-number: A725FXXSBFYC1

          ksu: ${{ github.event.inputs.kernelsu }}
          ksu-url: https://github.com/backslashxx/KernelSU
          ksu-version: master

          aosp-clang: true
          aosp-clang-version: r584948b
          aosp-gcc: true

          anykernel3: ${{ env.anykernel3 }}
          anykernel3-url: https://github.com/frstprjkt/AnyKernel3
          anykernel3-branch: a72q

          bootimg: ${{ env.bootimg }}
          bootimg-url: https://github.com/frstprjkt/kernel_build_sm7125/raw/refs/heads/main/bootimg/A725FXXSBFYC1-boot.img

          package-name: valeryn-ksu_$(date +%d%H%M)_a72q-${{ github.event.inputs.release-type }}

          artifact-upload: ${{ env.artifact-upload }}

          telegram-upload: ${{ env.telegram-upload }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
